[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gsee-climate-data"
version = "1.0.0"
authors = [
  { name = "Stefan Pfenninger", email = "stefan@pfenninger.org" },
]
description = "MERRA-2-derived daily irradiance PDFs for the GSEE climate data interface"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = ["numpy>=1.22"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]

[project.urls]
homepage = "https://github.com/renewables-ninja/gsee"
repository = "https://github.com/renewables-ninja/gsee"
documentation = "https://gsee.readthedocs.io"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gsee_climate_data = ["data/*.npz"]
