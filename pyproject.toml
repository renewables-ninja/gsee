[tool.pytest.ini_options]
minversion = "6.0"
# Fail on undeclared pytest markers rather than silently skipping them
addopts = "--strict-markers"
testpaths = ["tests"]
markers = [
  "reference: reference regression tests (deselect with -m 'not reference')",
]

[tool.coverage.run]
source = ["gsee"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["docs", "dist"]

[tool.ruff.lint]
# Defaults (pycodestyle errors, pyflakes) plus import sorting
extend-select = ["I"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["gsee*"]

[project]
name = "gsee"
authors = [
  { name = "Stefan Pfenninger", email = "stefan@pfenninger.org" },
]
description="GSEE: Global Solar Energy Estimator"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
requires-python = ">=3.12"
dynamic = ["version", "dependencies"]

[project.optional-dependencies]
climate = ["gsee-climate-data>=1,<2"]
legacy = ["ephem>=4.2.1"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
version = { attr = "gsee._version.__version__" }

[project.urls]
repository = "https://github.com/renewables-ninja/gsee"
changelog = "https://github.com/renewables-ninja/gsee/blob/main/CHANGELOG.md"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.dependencies]
python = ">=3.12,<3.14"

[tool.pixi.pypi-dependencies]
gsee = { path = ".", editable = true }
gsee-climate-data = { path = "packages/gsee-climate-data" }

[tool.pixi.feature.dev.pypi-dependencies]
pytest = ">=8.3"
pytest-cov = ">=6"
ruff = ">=0.8"
dask = ">=2024"
h5netcdf = ">=1.3"
mkdocs = ">=1.6"
mkdocs-material = ">=9.5"
ephem = ">=4.2.1"
matplotlib = ">=3.9"

# The minimal environment has no ephem, proving that gsee works without
# the optional legacy dependency (gsee.legacy tests skip themselves)
[tool.pixi.feature.minimal.pypi-dependencies]
pytest = ">=8.3"

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }
minimal = { features = ["minimal"] }

[tool.pixi.tasks]
test = "pytest"
test-cov = "pytest --cov --cov-report=xml --cov-report=term"
generate-reference = "python -m tests.reference.generate"
benchmark = "python benchmarks/benchmark.py"
format = "ruff format ."
format-check = "ruff format --check ."
lint = "ruff check ."
docs-figures = "python docs/figures/plot_model_comparison.py"
docs-build = { cmd = "mkdocs build --strict", depends-on = ["docs-figures"] }
docs-serve = { cmd = "mkdocs serve", depends-on = ["docs-figures"] }
